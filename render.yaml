# One click: https://render.com/deploy?repo=https://github.com/Eternity0207/StillHere
# Everything here is on Render's free plans, no card needed:
#   still-here      web service: Telegram webhook, dashboards, POST /heartbeat
#   still-here-db   Postgres: check-ins, moods, memories
# The heartbeat is triggered every 10 min by .github/workflows/heartbeat.yml (free).
# Prefer a native Render Cron Job? Uncomment the block at the bottom (Starter plan, needs a card).

databases:
  - name: still-here-db
    plan: free            # free Postgres expires after 30 days; switch to basic-256mb to keep Ben's history
    databaseName: stillhere
    user: stillhere

services:
  - type: web
    name: still-here
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn stillhere.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: still-here-db
          property: connectionString
      - key: GEMMA_API_KEY        # free key from https://aistudio.google.com/apikey
        sync: false
      - key: TELEGRAM_BOT_TOKEN   # from @BotFather on Telegram
        sync: false
      - key: FRIEND_NAME
        value: Ben
      - key: FRIEND_TIMEZONE
        value: Asia/Kolkata
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY            # opens /setup?key=<this>, and authorises POST /heartbeat
        generateValue: true

